            <h2>THE RULES</h2>
<div class="rule"><span class="rule-number">Rule 1:</span>
<span class="rule-text">Protect yourself.</span></div>
<div class="rule"><span class="rule-number">Rule 2:</span>
<span class="rule-text">Never move without thinking.</span></div>
<div class="rule"><span class="rule-number">Rule 3:</span>
<span class="rule-text">Safety before simplicity, simplicity before speed, and silence wherever possible.</span></div>
<div class="rule"><span class="rule-number">Rule 4:</span>
<span class="rule-text">Don’t go anywhere you can’t get back from.</span></div>
<div class="rule"><span class="rule-number">Rule 5:</span>
<span class="rule-text">Use your powers for good.</span></div>
